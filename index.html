<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Visual Novel Debug</title>
</head>
<body style="background: black; color: white; font-family: monospace; padding: 20px; font-size: 14px;">
  <div id="debug-log">ЗАГРУЗКА...</div>

  <script>
    const log = (msg) => {
      document.getElementById('debug-log').innerHTML += '<br>' + msg;
      console.log(msg);
    };

    window.addEventListener('error', (e) => {
      log('<span style="color:red">ОШИБКА: ' + e.message + '</span>');
    });

    // Принудительно грузим модуль и ловим ошибку
    log('Попытка загрузить engine/main.js...');
    
    import('./engine/main.js')
      .then(() => log('МОДУЛЬ MAIN.JS УСПЕШНО ЗАГРУЖЕН!'))
      .catch((err) => {
        log('<span style="color:red">КРИТИЧЕСКАЯ ОШИБКА ЗАГРУЗКИ:<br>' + err.message + '</span>');
        log('Стек: ' + (err.stack || 'нет стека'));
      });
  </script>
</body>
</html>
